<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070e0b">
<title>AZ - आज़ाद कहानी बुक</title>
<style>
  :root {
    --bg: #070e0b; --card: #101e19; --gold: #d4af37; --gold-lt: #fcf0c8;
    --text: #ffffff; --muted: #9eb3aa; --border: rgba(212, 175, 55, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 85px; overflow-x: hidden; }
  @media print { body { display: none !important; } }

  /* शाही सुनहरा AZ लोगो */
  .az-logo-ring {
    width: 90px; height: 90px; margin: 0 auto 14px; border-radius: 50%;
    border: 2.5px solid var(--gold); display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, #1a2e26 0%, #070e0b 100%);
    box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
  }
  .az-mini-badge {
    width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--gold);
    background: linear-gradient(135deg, #243b32, #09120e); color: var(--gold);
    font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center;
  }

  /* एक-बार का परमिशन गेट */
  #welcomeGate {
    position: fixed; inset: 0; background: #040907; z-index: 9999;
    display: flex; align-items: center; justify-content: center; padding: 18px;
  }
  .gate-box {
    background: var(--card); border: 1.5px solid var(--gold); border-radius: 22px;
    padding: 24px 20px; width: 100%; max-width: 370px; text-align: center;
  }
  .perm-list {
    text-align: left; background: #08110e; border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; margin: 12px 0; font-size: 12px; color: var(--gold-lt); line-height: 1.8;
  }

  /* हेडर */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 14px; background: #0b1612; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .brand-wrap { display: flex; align-items: center; gap: 8px; }
  .app-title { font-size: 15px; font-weight: bold; color: var(--gold); }
  .top-actions { display: flex; gap: 6px; }
  .top-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--gold);
    width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px;
  }

  /* व्यू और कार्ड्स */
  .tab-view { display: none; padding: 14px; }
  .tab-view.active { display: block; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 14px;
  }
  .shayari-card {
    min-height: 190px; display: flex; flex-direction: column; justify-content: space-between; border: 1.5px solid var(--gold);
  }
  .sec-head { color: var(--gold-lt); font-size: 15px; margin: 14px 0 10px; font-weight: bold; border-left: 3px solid var(--gold); padding-left: 8px; }
  .btn-gold { background: linear-gradient(135deg, #e5c158, #c59b27); color: #000; border: none; padding: 10px 15px; border-radius: 9px; font-weight: bold; cursor: pointer; font-size: 13px; }

  /* किताब रैक */
  .book-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .book-item {
    min-width: 155px; background: #14251f; border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; cursor: pointer; flex-shrink: 0;
  }
  .book-cover {
    height: 90px; border-radius: 8px; background: linear-gradient(135deg, #214035, #0e1d18);
    display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 8px;
  }

  /* रील रीडर */
  #reelReaderModal {
    display: none; position: fixed; inset: 0; background: #050a08; z-index: 500; flex-direction: column;
  }
  .reader-top {
    padding: 12px 15px; background: #0c1814; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gold);
  }
  .reel-scroll-container { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; }
  .reel-page {
    height: calc(100vh - 55px); scroll-snap-align: start; padding: 25px 20px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; border-bottom: 1px dashed var(--border); background: radial-gradient(circle at center, #13261f 0%, #060d0a 100%);
  }
  .arabic-text { font-size: 25px; color: var(--gold); line-height: 1.9; margin-bottom: 16px; font-weight: bold; direction: rtl; }
  .hindi-text { font-size: 17px; color: #fff; line-height: 1.7; max-width: 500px; }

  /* दुकान (Noon/Temu स्टाइल) */
  .ad-ticker {
    height: 76px; background: linear-gradient(90deg, #261c07, #14261f, #261c07);
    border: 1.5px solid var(--gold); border-radius: 12px; margin-bottom: 15px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 15px;
  }
  .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .shop-card-pro {
    background: #101e19; border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .shop-board {
    background: #1a2d26; border: 1px solid var(--gold); border-radius: 6px;
    padding: 5px; text-align: center; color: var(--gold-lt); font-weight: bold; font-size: 11px; margin-bottom: 6px;
  }
  .cod-tag {
    background: rgba(76, 175, 80, 0.18); color: #81c784; border: 1px solid #4caf50;
    font-size: 10px; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px;
  }

  /* एडमिन डैशबोर्ड */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-box { background: #0a1410; border: 1px solid var(--gold); border-radius: 10px; padding: 12px; text-align: center; }

  /* फ्लोटिंग प्लस (+) बटन */
  .mini-fab {
    position: fixed; bottom: 88px; right: 18px; width: 46px; height: 46px;
    background: var(--gold); color: #000; border-radius: 50%; border: none;
    font-size: 24px; font-weight: bold; box-shadow: 0 4px 14px rgba(212,175,55,0.5);
    cursor: pointer; z-index: 95; display: flex; align-items: center; justify-content: center;
  }

  /* बॉटम नेविगेशन */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 68px;
    background: #0a1410; border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: center; z-index: 100;
  }
  .nav-btn { display: flex; flex-direction: column; align-items: center; color: var(--muted); font-size: 11px; cursor: pointer; gap: 3px; }
  .nav-btn.active { color: var(--gold); font-weight: bold; }
  .jabiya-wrap { position: relative; top: -16px; text-align: center; cursor: pointer; }
  .jabiya-orb {
    width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, #224d3e, #091410);
    border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: var(--gold); box-shadow: 0 0 15px rgba(212,175,55,0.6);
  }

  /* मोडल */
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    z-index: 400; align-items: center; justify-content: center; padding: 18px;
  }
  .modal-card {
    background: var(--card); border: 1px solid var(--gold); border-radius: 16px;
    padding: 20px; width: 100%; max-width: 380px; max-height: 88vh; overflow-y: auto;
  }
  input, textarea, select {
    width: 100%; padding: 10px; background: #08100d; border: 1px solid var(--border);
    color: #fff; border-radius: 8px; margin: 7px 0; font-size: 13px;
  }
</style>
</head>
<body>

  <!-- 1. एक-बार की अनुमति स्क्रीन (Allow All) -->
  <div id="welcomeGate">
    <div class="gate-box">
      <div class="az-logo-ring"><span style="font-size:36px; font-weight:900; color:#d4af37; letter-spacing:2px;">AZ</span></div>
      <h2 style="color:var(--gold); margin-bottom:4px;">आज़ाद कहानी बुक</h2>
      <p style="font-size:12px; color:var(--muted);">भाषा चुनें और नीचे सभी अनुमतियाँ एक साथ दें (दोबारा नहीं मांगेगा):</p>
      <select id="gateLangSelect">
        <option value="hi">🇮🇳 हिन्दी (India - Hindi)</option>
        <option value="ur">🇵🇰🇮🇳 اردو (Urdu)</option>
        <option value="ar">🇸🇦🇦🇪 العربية (Arabic)</option>
        <option value="mr">🇮🇳 मराठी (Marathi)</option>
        <option value="en">🌍 English (Global)</option>
      </select>
      <div class="perm-list">
        <div>📷 कैमरा और गैलरी अनुमति (Camera & Upload)</div>
        <div>📍 लाइव लोकेशन अनुमति (Shop & Delivery GPS)</div>
        <div>🎙️ जाबिया AI माइक्रोफ़ोन अनुमति (Voice Assistant)</div>
        <div>🔔 नोटिफिकेशन और अनलिमिटेड स्टोरेज</div>
      </div>
      <button type="button" class="btn-gold" style="width:100%; padding:13px; font-size:14px;" onclick="grantAllPermissionsAndEnter()">सभी अनुमतियाँ दें और ऐप खोलें (Allow All) ✓</button>
    </div>
  </div>

  <!-- 2. हेडर -->
  <div class="header">
    <div class="brand-wrap">
      <div class="az-mini-badge">AZ</div>
      <div class="app-title" data-k="title">आज़ाद कहानी बुक</div>
    </div>
    <div class="top-actions">
      <div class="top-btn" onclick="openModal('writeShayariModal')" title="शायरी लिखें">✍️</div>
      <div class="top-btn" onclick="openModal('chatHistoryModal')" title="पिछली चैट">💬</div>
      <div class="top-btn" onclick="openAdminLogin()" style="border-color:#ff9800;" title="मालिक का डैशबोर्ड">👑</div>
      <div class="top-btn" onclick="switchTab('settings')" title="सेटिंग्स">⚙️</div>
    </div>
  </div>

  <!-- 3. होम (दुनिया के नंबर-1 शायर) -->
  <div id="view-home" class="tab-view active">
