name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Make gradlew
        run: |
          echo "plugins { id 'com.android.application' id 'org.jetbrains.kotlin.android' } android { namespace 'com.azadkahani.v31' compileSdk 34 defaultConfig { applicationId 'com.azadkahani.v31' minSdk 24 targetSdk 34 versionCode 31 versionName '31.0' } buildTypes { release { minifyEnabled false } } compileOptions { sourceCompatibility JavaVersion.VERSION_1_8 targetCompatibility JavaVersion.VERSION_1_8 } kotlinOptions { jvmTarget = '1.8' } } dependencies { implementation 'androidx.core:core-ktx:1.12.0' implementation 'androidx.appcompat:appcompat:1.6.1' }" > app/build.gradle
          ls app/src/main/
      - name: Build Debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AzadKahani-V31-JARVIS-APK
          path: app/build/outputs/apk/debug/*.apk
